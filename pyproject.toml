[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crdt-agent-knowledge-graph"
version = "0.1.0"
description = "Conflict-free replicated data type knowledge graph for multi-agent peer synchronization with zero merge conflicts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
crdt-agent-knowledge-graph = "crdt_agent_knowledge_graph.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crdt_agent_knowledge_graph*"]
